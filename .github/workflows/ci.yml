name: Bank Ledger CI

# Run CI whenever code is pushed to main
# or when a pull request is opened against main.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Verify Node version
      - name: Check Node version
        run: node -v

      # Install dependencies
      - name: Install backend dependencies
        run: npm ci

      # Verify backend starts
      - name: Verify backend
        run: node --check server.js

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Verify Node version
      - name: Check Node version
        run: node -v

      # Install dependencies
      - name: Install frontend dependencies
        run: npm ci

      # Build React/Vite application
      - name: Build frontend
        env:
          VITE_API_URL: http://localhost:3000
        run: npm run build