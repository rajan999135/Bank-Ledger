name: Bank Ledger CI

# Run checks:
# 1. When a pull request targets main
# 2. When a commit is pushed or merged into main
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # Download the repository into the GitHub runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the same major Node version as the project.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Display Node version
        run: node --version

      # Install exact versions from package-lock.json.
      - name: Install backend dependencies
        run: npm ci

      # Check the entry file.
      - name: Check server syntax
        run: node --check server.js

      # Check every JavaScript file inside backend/src.
      - name: Check backend source syntax
        run: |
          find src -type f -name "*.js" -print0 |
          xargs -0 -n1 node --check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Display Node version
        run: node --version

      - name: Install frontend dependencies
        run: npm ci

      # Use the live API URL only for compiling the production frontend.
      # This build does not send requests to the API.
      - name: Build frontend
        env:
          VITE_API_URL: https://bank-ledger-api-nic1.onrender.com
        run: npm run build