name: Bank Ledger CI

# Run CI whenever code is pushed to main
# or a pull request is opened against main.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # Download the repository code into the GitHub runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install backend dependencies exactly from package-lock.json.
      - name: Install backend dependencies
        run: npm ci

      # Check backend JavaScript files for syntax errors.
      - name: Check backend syntax
        run: |
          node --check server.js
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # Download the repository code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install frontend dependencies.
      - name: Install frontend dependencies
        run: npm ci

      # Verify that the Vite frontend builds successfully.
      - name: Build frontend
        env:
          VITE_API_URL: http://localhost:3000
        run: npm run build